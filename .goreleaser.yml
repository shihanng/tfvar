version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

before:
  hooks:
    - make mod-check

builds:
  - goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE*
      - README*

nfpms:
  - homepage: https://github.com/shihanng/tfvar
    maintainer: Shi Han NG <shihanng@gmail.com>
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    description: "Terraform's variable definitions template generator."
    bindir: /usr/local/bin
    license: MIT
    formats:
      - deb
      - rpm

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  disable: true
